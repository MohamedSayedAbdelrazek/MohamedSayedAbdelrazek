name: Profile stats

# Rebuilds the "Activity Monitor" card from the GitHub API and publishes it to the
# `output` branch, so the main branch history only contains real changes.

on:
  schedule:
    - cron: "37 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Render dashboard
        run: python scripts/build.py stats --out dist
        env:
          # Optional: add a PROFILE_STATS_TOKEN secret (classic PAT, read:user) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Refresh activity stats"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
